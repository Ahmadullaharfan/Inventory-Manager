<div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03] {{ className }}">
  <!-- Card Header -->
  <div class="px-6 py-5 flex justify-between">
    <h3 class="text-base font-medium text-gray-800 dark:text-white/90">
      {{ title }}
    </h3>

    @if(addbutton){
    <app-button size="sm" (btnClick)="onButtonClick()">{{ buttonTitle }}</app-button>
    }

  </div>

  <!-- Card Body -->
  <div class="p-4 border-t border-gray-100 dark:border-gray-800 sm:p-6">
    <div class="space-y-6">
      <ng-content></ng-content>
    </div>
  </div>
</div>
