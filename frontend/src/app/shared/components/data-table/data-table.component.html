<div class="mx-auto relative">

  <!-- Loading overlay -->
  <div
    *ngIf="loading"
    class="absolute inset-0 z-20 flex items-center justify-center bg-white/70 backdrop-blur-sm transition-opacity duration-200"
    role="status"
    aria-live="polite"
  >
    <div class="flex items-center gap-4 rounded-2xl border border-slate-200 bg-white/95 px-5 py-4 shadow-xl shadow-slate-200/60">
      <div class="relative flex h-11 w-11 items-center justify-center rounded-full bg-sky-50">
        <span class="absolute inset-0 rounded-full border border-sky-200/80"></span>
        <span class="absolute inset-1 rounded-full border-2 border-sky-100 border-t-sky-500 animate-spin"></span>
        <i class="fa fa-spinner text-sky-600 text-sm"></i>
      </div>
      <div class="space-y-0.5 text-left">
        <p class="text-sm font-semibold text-slate-800">{{ loadingLabel }}</p>
        <p class="text-xs text-slate-500">Please wait…</p>
      </div>
    </div>
  </div>

  <!-- Table wrapper -->
  <div
    *ngIf="data && data.length > 0; else emptyState"
    class="table-container overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm"
    [class.table-refreshing]="isRefreshing"
  >
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-slate-200">
        <!-- Header -->
        <thead class="bg-slate-50 sticky top-0 z-10">
          <tr>
            <th
              *ngFor="let column of columns"
              scope="col"
              class="px-4 py-3 text-center text-[11px] font-semibold uppercase tracking-wider text-slate-600 whitespace-nowrap"
            >
              {{ column.label }}
            </th>
          </tr>
        </thead>

        <!-- Body -->
        <tbody class="divide-y divide-slate-100 bg-white">
          <tr
            *ngFor="let row of data; let i = index"
            class="table-row group transition-colors duration-150 hover:bg-sky-50/50"
            [style.animationDelay]="(i * 0.01) + 's'"
          >
            <td
              *ngFor="let column of columns"
              class="px-4 py-3 text-center text-sm text-slate-700 whitespace-nowrap"
              [ngClass]="{
                'max-w-[22rem] truncate': column.key === 'description',
                'font-medium text-slate-900': column.key === 'name' || column.key === 'title',
                'tabular-nums': column.key === 'price'
              }"
            >
              <ng-container *ngIf="column.key !== 'actions'; else actionsTpl">
                <span *ngIf="row[column.key] !== null && row[column.key] !== undefined && row[column.key] !== ''; else dashTpl">
                  {{ column.key === 'price' ? formatPrice(row[column.key]) : row[column.key] }}
                </span>
                <ng-template #dashTpl>
                  <span class="text-slate-400">—</span>
                </ng-template>
              </ng-container>

              <ng-template #actionsTpl>
                <div class="inline-flex items-center gap-1">
                  <button
                    (click)="onEdit(row)"
                    type="button"
                    aria-label="Edit row"
                    title="Edit"
                    class="inline-flex h-8 w-8 items-center justify-center rounded-lg text-sky-600 transition-all hover:bg-sky-100 hover:scale-105 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400"
                  >
                    <i class="fa fa-pencil-square-o"></i>
                  </button>
                  <button
                    (click)="onDelete(row.id)"
                    type="button"
                    aria-label="Delete row"
                    title="Delete"
                    class="inline-flex h-8 w-8 items-center justify-center rounded-lg text-rose-600 transition-all hover:bg-rose-100 hover:scale-105 focus:outline-none focus-visible:ring-2 focus-visible:ring-rose-400"
                  >
                    <i class="fa fa-trash-o"></i>
                  </button>
                </div>
              </ng-template>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Empty state -->
  <ng-template #emptyState>
    <div class="flex flex-col items-center justify-center rounded-xl border border-dashed border-slate-300 bg-slate-50/50 py-16 animate-in fade-in duration-300">
      <div class="mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-slate-100">
        <i class="fa fa-inbox text-xl text-slate-400"></i>
      </div>
      <p class="text-base font-medium text-slate-700">No data found</p>
      <p class="mt-1 text-sm text-slate-500">There's nothing to display right now.</p>
    </div>
  </ng-template>

</div>
