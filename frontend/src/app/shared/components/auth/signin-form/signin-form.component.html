<div class="mx-auto flex w-full max-w-md flex-1 flex-col justify-center px-4 py-10">
  <div class="mb-8"><h1 class="mb-2 text-title-sm font-semibold text-gray-800 dark:text-white/90">Sign In</h1><p class="text-sm text-gray-500 dark:text-gray-400">Sign in to your inventory account. Admins, managers and users all sign in here using their own email and password.</p></div>
  @if (error()) { <p role="alert" class="mb-5 rounded-lg bg-error-50 p-3 text-sm text-error-600 dark:bg-error-500/10 dark:text-error-400">{{ error() }}</p> }
  <form (ngSubmit)="onSignIn()" class="space-y-5">
    <div><app-label for="signin-email">Email</app-label><app-input-field id="signin-email" type="email" [(value)]="email" [disabled]="busy()" /></div>
    <div><app-label for="signin-password">Password</app-label><app-input-field id="signin-password" [type]="showPassword ? 'text' : 'password'" [(value)]="password" [disabled]="busy()" /><button type="button" (click)="togglePasswordVisibility()" class="mt-2 text-xs text-gray-500 dark:text-gray-400">{{ showPassword ? 'Hide password' : 'Show password' }}</button></div>
    @if (needsCode()) { <div><app-label for="signin-code">Authenticator or recovery code</app-label><app-input-field id="signin-code" [(value)]="code" [disabled]="busy()" /></div> }
    <label class="flex items-center gap-3 text-sm text-gray-700 dark:text-gray-400"><input type="checkbox" name="remember" [(ngModel)]="isChecked" [disabled]="busy()" class="size-4 accent-brand-500" />Remember me</label>
    <app-button type="submit" className="w-full" [disabled]="busy()">{{ busy() ? 'Signing in…' : 'Sign In' }}</app-button>
  </form>
  <p class="mt-6 text-sm text-gray-500 dark:text-gray-400">Need an account? <a routerLink="/signup" class="font-medium text-brand-500 dark:text-brand-400">Sign Up</a></p>
</div>
