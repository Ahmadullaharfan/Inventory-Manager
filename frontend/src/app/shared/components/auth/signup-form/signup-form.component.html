<div class="mx-auto flex w-full max-w-md flex-1 flex-col justify-center px-4 py-10">
  <div class="mb-8"><h1 class="mb-2 text-title-sm font-semibold text-gray-800 dark:text-white/90">Sign Up</h1><p class="text-sm text-gray-500 dark:text-gray-400">Create your inventory account.</p></div>
  @if (error()) { <p role="alert" class="mb-5 rounded-lg bg-error-50 p-3 text-sm text-error-600 dark:bg-error-500/10 dark:text-error-400">{{ error() }}</p> }
  <form (ngSubmit)="onSignUp()" class="space-y-5"><div class="grid grid-cols-1 gap-4 sm:grid-cols-2"><div><app-label for="signup-first-name">First name</app-label><app-input-field id="signup-first-name" [(value)]="fname" [disabled]="busy()" /></div><div><app-label for="signup-last-name">Last name</app-label><app-input-field id="signup-last-name" [(value)]="lname" [disabled]="busy()" /></div></div>
    <div><app-label for="signup-email">Email</app-label><app-input-field id="signup-email" type="email" [(value)]="email" [disabled]="busy()" /></div>
    <div><app-label for="signup-password">Password (at least 8 characters)</app-label><app-input-field id="signup-password" type="password" [(value)]="password" [disabled]="busy()" /></div>
    <div><app-label for="signup-confirm-password">Confirm password</app-label><app-input-field id="signup-confirm-password" type="password" [(value)]="confirmation" [disabled]="busy()" /></div>
    <app-button type="submit" className="w-full" [disabled]="busy()">{{ busy() ? 'Creating account…' : 'Create account' }}</app-button>
  </form><p class="mt-6 text-sm text-gray-500 dark:text-gray-400">Already have an account? <a routerLink="/signin" class="font-medium text-brand-500 dark:text-brand-400">Sign In</a></p>
</div>
