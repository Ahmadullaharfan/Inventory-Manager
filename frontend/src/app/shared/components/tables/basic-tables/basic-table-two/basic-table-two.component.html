<div class="overflow-hidden rounded-2xl border border-gray-200 bg-white pt-4 dark:border-white/[0.05] dark:bg-white/[0.03]">
  @if (title) {
    <h3 class="mb-4 px-6 text-lg font-semibold text-gray-800 dark:text-white/90">
      {{ title }}
    </h3>
  }

      <ng-container   class="max-w-full overflow-x-auto">
        <table class="min-w-full" mat-table [dataSource]="dataSource">
          @for(column of displayedColumns; track column) {
            <div matColumnDef="{{column}}">
              <th
                class="text-center px-4 py-3.5 text-gray-900 text-theme-sm   dark:text-white/90"
                mat-header-cell
                *matHeaderCellDef
              >
                {{ columnHeaders[column] }}
              </th>
              <td
                class="px-4 sm:px-6 py-3.5 text-gray-500 text-theme-sm dark:text-gray-400"
                mat-cell
                *matCellDef="let element"
              >
                {{ element[column] }}
              </td>
            </div>
          }
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
        <mat-paginator [pageSize]="5"
                [pageSizeOptions]="[5, 10, 20]"
                      showFirstLastButtons
                      aria-label="Select page of users">
        </mat-paginator>
      </ng-container >
</div>
