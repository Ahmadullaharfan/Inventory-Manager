<app-page-breadcrumb pageTitle="Users" />

    <app-component-card title="Basic Table 2">
      <div  class="max-w-full overflow-x-auto">
        <table class="min-w-full" mat-table [dataSource]="dataSource">
         @for(column of displayedColumns; track column) {
          <div matColumnDef="{{column}}">
            <th class="px-6 py-3 font-medium text-gray-500 sm:px-6 text-theme-xs dark:text-gray-400 text-start" mat-header-cell *matHeaderCellDef> {{column}} </th>
            <td  class="px-4 sm:px-6 py-3.5 text-gray-500 text-theme-sm dark:text-gray-400" mat-cell *matCellDef="let element"> {{element[column]}} </td>
         </div>
         }
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                      showFirstLastButtons
                      aria-label="Select page of users">
        </mat-paginator>
      </div>
    </app-component-card>
