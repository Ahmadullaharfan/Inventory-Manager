<div class="min-h-screen bg-gray-50 py-10 px-4">
  <div class="max-w-4xl mx-auto">

    <!-- Page heading -->
    <div class="mb-8 text-center">
      <h2 class="text-3xl font-semibold tracking-tight text-gray-900">
        {{ isEditMode ? 'Edit Product' : 'Add New Product' }}
      </h2>
      <p class="text-sm text-gray-500 mt-1">
        {{ isEditMode
            ? 'Update the details below and save your changes.'
            : 'Fill in the details to add a new product to your inventory.' }}
      </p>
    </div>

    <!-- Card -->
    <form
      [formGroup]="productForm"
      (ngSubmit)="onSubmit()"
      class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8 space-y-8"
    >

    @if (successMessage()) {
      <div class="rounded-lg bg-green-50 border border-green-200 text-green-800
                  text-sm px-4 py-3 flex items-center gap-2">
        <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>
        {{ successMessage() }}
      </div>
    }
      <!-- ================= Section: Basic Info ================= -->
      <section class="space-y-5">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-gray-500">
          Basic Information
        </h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

          <div>
            <app-input
              label="Product Name"
              placeholder="Enter product name"
              formControlName="name"
              [required]="true"
            />
            <app-field-error
              [control]="f.name"
              label="Product Name"
            />
          </div>

          <div>
            <app-input
              label="Brand"
              placeholder="Enter brand name"
              formControlName="brand"
            />
            <app-field-error [control]="f.brand" label="Brand" />
          </div>

          <div class="md:col-span-2">
            <app-input
              label="Description"
              placeholder="Enter product description"
              formControlName="description"
            />
            <app-field-error [control]="f.description" label="Description" />
          </div>

        </div>
      </section>

      <hr class="border-gray-100" />

      <!-- ================= Section: Pricing & Inventory ================= -->
      <section class="space-y-5">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-gray-500">
          Pricing & Inventory
        </h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

          <div>
            <app-input
              type="number"
              label="Cost Price"
              placeholder="0.00"
              formControlName="cost_price"
              [required]="true"
            />
            <app-field-error
              [control]="f.cost_price"
              label="Cost Price"
            />
          </div>

          <div>
            <app-input
              label="Unit of Measure"
              placeholder="e.g. Piece, Kg, Liter"
              formControlName="unit_of_measure"
              [required]="true"
            />
            <app-field-error
              [control]="f.unit_of_measure"
              label="Unit of Measure"
            />
          </div>

          <div>
            <app-input
              type="number"
              label="Units Per Package"
              placeholder="1"
              formControlName="units_per_package"
              [required]="true"
            />
            <app-field-error
              [control]="f.units_per_package"
              label="Units Per Package"
            />
          </div>

          <div>
            <app-input
              label="Location"
              placeholder="e.g. Aisle 3, Shelf 2"
              formControlName="location"
            />
            <app-field-error [control]="f.location" label="Location" />
          </div>

        </div>
      </section>

      <hr class="border-gray-100" />

      <!-- ================= Section: Media & Status ================= -->
      <section class="space-y-5">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-gray-500">
          Media & Status
        </h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 items-start">

          <div class="md:col-span-1">
            <app-image-dropzone
              [previewUrl]="previewUrl"
              (fileSelected)="onFileSelected($event)"
            />
          </div>

          <div class="md:col-span-1 flex items-center md:items-start md:pt-7">
            <label
              for="is_active"
              class="flex items-center gap-3 cursor-pointer select-none
                     px-4 py-3 rounded-lg border border-gray-200
                     hover:bg-gray-50 transition-colors w-full"
            >
              <input
                id="is_active"
                type="checkbox"
                formControlName="is_active"
                class="w-4 h-4 rounded border-gray-300 text-black
                       focus:ring-2 focus:ring-black/80 focus:ring-offset-1
                       accent-black cursor-pointer"
              />
              <div class="flex flex-col">
                <span class="text-sm font-medium text-gray-800">
                  Active Product
                </span>
                <span class="text-xs text-gray-500">
                  Make this product available for sale
                </span>
              </div>
            </label>
          </div>

        </div>
      </section>

      <!-- ================= Actions ================= -->
      <div
        class="flex flex-col-reverse sm:flex-row sm:justify-end gap-3
               pt-6 border-t border-gray-100"
      >
        <button
          type="button"
          (click)="cancel()"
          class="px-5 py-2.5 text-sm font-medium rounded-lg
                 text-gray-700 bg-white border border-gray-300
                 hover:bg-gray-50
                 transition-all duration-150
                 active:scale-[0.98]"
        >
          Cancel
        </button>

       <button
          type="submit"
          [disabled]="productForm.invalid || saving()"
          class="px-5 py-2.5 text-sm font-medium rounded-lg
                text-white bg-black hover:bg-gray-900
                transition-all duration-150 active:scale-[0.98]
                disabled:opacity-40 disabled:cursor-not-allowed
                inline-flex items-center gap-2"
        >
          @if (saving()) {
            <svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none">
              <circle class="opacity-25" cx="12" cy="12" r="10"
                      stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
          }
          {{ isEditMode ? 'Update Product' : 'Save Product' }}
        </button>
      </div>

    </form>
  </div>
</div>
